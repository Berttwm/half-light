<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Half-Light</title>
<meta property="og:title" content="Half-Light">
<meta property="og:description" content="the inner machinations of a photographic mind are an enigma">
<meta property="og:image" content="https://half-light.pages.dev/photos/og.jpg">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header>
  <div class="title" id="title"></div>
  <a href="index.html">&larr;&nbsp;PROJECTION&nbsp;ROOM</a>
</header>
<div id="rolls"></div>
<div class="lightbox" id="lb"><img id="lbimg" alt=""><div class="meta" id="lbmeta"></div></div>
<script src="assets/data.a7a799f5f8.js"></script>
<script>
  // pre-sorted DARK-FIRST (night rack, then serpentine bands) by the composer; no client-side sort here.
  const photos = window.SHEET.map(id => window.PHOTOS[id]);
  const TITLE = window.META.title.toUpperCase();
  document.getElementById('title').innerHTML = TITLE + '&nbsp;&nbsp;—&nbsp;&nbsp;ARCHIVE';

  const byId = {};
  photos.forEach(p => { byId[p.id] = p; });

  const holder = document.getElementById('rolls');
  const sec = document.createElement('section');
  sec.className = 'roll';
  sec.innerHTML = '<h2>THE SHEET — EMBER TO ICE, DARK TO LIGHT</h2><div class="strip"></div>';
  holder.appendChild(sec);
  const strip = sec.querySelector('.strip');

  const frameHTML = p =>
    '<div class="frame" tabindex="0" data-id="' + p.id + '">' +
    '<div class="edge">' + p.frame + 'A &middot; ' + TITLE + ' 400</div>' +
    '<img src="' + p.thumb + '" width="' + p.w + '" height="' + p.h + '" loading="lazy" style="background:#0b0b0b url(' + p.latent + ') center/cover">' +
    '<div class="date">' + p.date + '</div></div>';

  // rows-flow masonry: place each photo into the currently-shortest column so the
  // DARK-FIRST order still reads left-to-right; heights tracked as h/w ratios
  // (+0.18 per card for the two label rows, in column-width units).
  function layout() {
    const n = Math.max(2, Math.min(6, Math.floor(strip.clientWidth / 250)));
    const cols = Array.from({ length: n }, () => ({ h: 0, html: '' }));
    photos.forEach(p => {
      const c = cols.reduce((a, b) => b.h < a.h ? b : a);
      c.html += frameHTML(p);
      c.h += p.h / p.w + 0.18;
    });
    strip.innerHTML = cols.map(c => '<div class="col">' + c.html + '</div>').join('');
  }
  let rw = innerWidth;
  addEventListener('resize', () => { if (Math.abs(innerWidth - rw) > 60) { rw = innerWidth; layout(); } });
  layout();

  const lb = document.getElementById('lb');
  const lbimg = document.getElementById('lbimg');
  const lbmeta = document.getElementById('lbmeta');

  function openLightbox(p) {
    lbimg.src = p.full;
    let meta = '<b>No. ' + p.frame + '</b> · ' + p.date + ' · X100T';
    if (p.caption) meta += '<span class="caption">' + p.caption + '</span>';
    lbmeta.innerHTML = meta;
    lb.classList.add('open');
  }

  holder.addEventListener('click', e => {
    const f = e.target.closest('.frame');
    if (!f) return;
    openLightbox(byId[f.dataset.id]);
  });
  holder.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const f = e.target.closest('.frame');
    if (!f) return;
    e.preventDefault();
    openLightbox(byId[f.dataset.id]);
  });
  lb.addEventListener('click', () => lb.classList.remove('open'));
  addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
</script>
</body>
</html>
