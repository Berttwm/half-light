<!doctype html><meta charset=utf-8><title>probe</title>
<style>body{margin:0;background:#222}iframe{border:0;height:1024px;vertical-align:top}</style>
<div id=frames></div>
<script>
const WIDTHS = [768, 753, 720, 701, 700];
document.getElementById('frames').innerHTML = WIDTHS.map(w =>
  `<iframe id="p${w}" style="width:${w}px" src="/index.html"></iframe>`).join('');
window.measure = function () {
  const out = {};
  for (const wd of WIDTHS) {
    const f = document.getElementById('p' + wd), w = f.contentWindow, d = w.document;
    if (!w.__render) { out[wd] = 'not ready'; continue; }
    const fl = f.getBoundingClientRect().left;
    out[wd] = { client: d.documentElement.clientWidth, sc: {} };
    for (const i of [3, 7, 10, 13, 5]) {
      w.__render(i);
      const sc = d.querySelectorAll('.scene')[i];
      const mv = sc.querySelector('.mover'), neg = sc.querySelector('.neg'), q = sc.querySelector('.sideq');
      const rc = x => x ? { l: +(x.getBoundingClientRect().left - fl).toFixed(1), r: +(x.getBoundingClientRect().right - fl).toFixed(1) } : null;
      let last = null;
      if (q) last = [...q.querySelectorAll('.w')].map(x => ({ t: x.textContent, r: +(x.getBoundingClientRect().right - fl).toFixed(1) })).sort((a, b) => b.r - a.r).slice(0, 2);
      out[wd].sc[i] = {
        mover: +mv.getBoundingClientRect().width.toFixed(1), neg: rc(neg), q: rc(q),
        qw: q ? +q.getBoundingClientRect().width.toFixed(2) : null,
        qmax: q ? w.getComputedStyle(q).maxWidth : null,
        dir: w.getComputedStyle(mv).flexDirection,
        scrollW: d.documentElement.scrollWidth, cw: d.documentElement.clientWidth
      };
    }
  }
  return out;
};
</script>
