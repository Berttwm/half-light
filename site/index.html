<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Half-Light</title>
<meta property="og:title" content="Half-Light">
<meta property="og:description" content="the inner machinations of a photographic mind are an enigma">
<meta property="og:image" content="photos/og.jpg">
<link rel="stylesheet" href="assets/site.css">
<style>
  #bg { position: fixed; inset: 0; background: var(--ground); transition: background-color 1.2s ease; }
  #bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55) 100%); }
  #glowA, #glowB { position: fixed; inset: 0; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  #dust { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #dust span { position: absolute; border-radius: 50%; background: rgba(232,193,138,.55); animation: mote linear infinite; }
  @keyframes mote {
    0%   { transform: translate(0, 0); opacity: 0; }
    12%  { opacity: var(--o); }
    55%  { transform: translate(var(--sway), -18vh); opacity: var(--o); }
    100% { transform: translate(calc(var(--sway) * -0.6), -34vh); opacity: 0; }
  }
  #scrim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 55; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 60; display: flex; justify-content: space-between; padding: 22px 30px; }
  nav .title { font-family: var(--serif); font-style: italic; font-size: 17px; letter-spacing: .06em; }
  nav a { font-family: var(--mono); font-size: 10px; letter-spacing: .28em; color: var(--ink-dim); }
  nav a:hover { color: var(--safelight); }

  .slide { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; pointer-events: none; }
  .slide .mover { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; will-change: transform; }
  .slide .fill { position: absolute; inset: -80px; background-size: cover; background-position: center; filter: blur(70px) brightness(.34) saturate(1.05); }

  /* every photograph lives in the same negative frame — one consistent presentation */
  .neg { position: relative; background: #0a0a0a; padding: 22px 30px 34px; box-shadow: 0 24px 70px rgba(0,0,0,.65); }
  .neg::before, .neg::after {
    content: ''; position: absolute; top: 8px; bottom: 8px; width: 12px;
    background-image: radial-gradient(circle, var(--ground) 2.6px, transparent 3.2px);
    background-size: 12px 22px; background-repeat: repeat-y;
  }
  .neg::before { left: 9px; }
  .neg::after { right: 9px; }
  .neg .edge { position: absolute; bottom: 11px; left: 30px; right: 30px; display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: #93763f; white-space: nowrap; }
  .ch { display: inline-block; will-change: transform; }

  /* the window: overflow-hidden frame, oversized image inside for inner parallax (Codrops 2019 recipe) */
  .win { position: relative; overflow: hidden; }
  .win img { position: absolute; left: -8%; top: -8%; width: 116%; height: 116%; object-fit: cover; will-change: transform; }
  .solo .win { height: min(66vh, calc(78vw * var(--ir))); aspect-ratio: calc(1 / var(--ir)); }
  .pair { position: relative; display: flex; gap: 2vw; align-items: center; }
  .pair .neg .win { height: min(60vh, calc(34vw * var(--ir))); aspect-ratio: calc(1 / var(--ir)); }
  .frames { position: relative; display: flex; gap: 2vw; align-items: center; flex-shrink: 0; }
  .frames .neg .win { height: 54vh; aspect-ratio: calc(1 / var(--ir)); }

  .txtscene .txt { text-align: center; max-width: 94vw; position: relative; }
  .txtscene h1 { font-size: clamp(34px, 6vw, 58px); font-weight: normal; letter-spacing: .3em; }
  .txtscene .line { font-family: var(--serif); font-style: italic; font-size: clamp(15px, 1.9vw, 24px); letter-spacing: .05em; color: var(--ink); line-height: 1.7; margin-top: 34px; white-space: nowrap; }
  .txtscene .mono { font-size: 10px; }

  #counter { position: fixed; right: 30px; bottom: 26px; z-index: 60; font-family: var(--mono); font-size: 10px; letter-spacing: .25em; color: var(--ink-dim); transition: opacity .6s; }
  #rail { position: fixed; right: 14px; top: 15vh; bottom: 15vh; width: 1px; background: #2a2a2a; z-index: 60; }
  #dot { position: absolute; left: -2px; width: 5px; height: 5px; border-radius: 50%; background: var(--safelight); }
  .hint { position: fixed; bottom: 26px; left: 0; right: 0; text-align: center; z-index: 60; transition: opacity .8s; }
  .hint.gone { opacity: 0; }

  @media (max-width: 700px) {
    nav { padding: 16px 18px; }
    .neg { padding: 12px 18px 24px; }
    .neg::before { left: 5px; } .neg::after { right: 5px; }
    .neg .edge { left: 18px; right: 18px; font-size: 7px; }
    .solo .win { height: min(56vh, calc(88vw * var(--ir))); }
    .pair { gap: 8px; }
    .pair .neg .win { height: min(50vh, calc(38vw * var(--ir))); }
    .frames { flex-direction: column; gap: 10px; }
    .frames .neg .win { height: auto; width: 68vw; }
    .txtscene .line { white-space: normal; }
    #rail { right: 8px; } #counter { right: 20px; }
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="glowA"></div>
<div id="glowB"></div>
<div id="dust"></div>
<nav>
  <div class="title" id="navTitle"></div>
  <a href="contact.html">CONTACT&nbsp;SHEET&nbsp;&rarr;</a>
</nav>
<div id="screen"></div>
<div id="scrim"></div>
<div id="rail"><div id="dot"></div></div>
<div id="counter"></div>
<div class="hint mono" id="hint">SCROLL TO BEGIN THE PROJECTION</div>
<div id="spacer"></div>
<script src="assets/data.b955ed9d3f.js"></script>
<script>
(() => {
  const byId = window.PHOTOS;
  const G = '#131313';
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TITLE = window.META.title;                  // pseudonym, single source — a config.json swap propagates everywhere
  document.getElementById('navTitle').textContent = TITLE;

  // ONE transition language for the reel (crossfade through black + continuous micro-zoom + inner parallax),
  // with exactly two clip-mask set pieces: the letterbox open on the hero, the iris on the mirror shot.
  // Scenes come from the composer (window.SCENES), bookended by data-driven intro/outro text cards.
  const SCENES = [
    { type: 'text', tint: G, scatter: true,
      html: `<h1>${TITLE.toUpperCase()}</h1><p class="line">${window.META.intro_line}</p>` },
    ...window.SCENES.map(s => ({ ...s })),
    { type: 'text', tint: G,
      html: '<p class="line">the roll continues</p><div class="mono" style="margin-top:22px">NEW FRAMES ARE DEVELOPED AS THEY ARE TAKEN</div>' },
  ];
  const SEG = 1.15;
  const LERP = 0.1;                                  // Recipe 1: inertia layer, f = 0.08-0.12
  const ease = p => p * p * (3 - 2 * p);             // smoothstep ~ power1.inOut (0.45,0,0.55,1); monotonic — safe to scrub

  let gi = 0;
  const neg = (p, full) => {
    const n = p.frame.replace('No. ', '');
    const edge = full
      ? `<span>${TITLE.toUpperCase()} 400</span><span>${n}A&ensp;&middot;&ensp;${p.date}</span>`
      : `<span>${n}A</span><span>${p.date}</span>`;
    const plx = 32 + (gi++ * 13) % 26;               // Recipe 2: per-image parallax depth 32-58px
    // lazy-loaded: no src yet — data-src is promoted in paint() once the scene nears view; the
    // latent (tiny blurred) placeholder shows as a CSS background under the empty <img> until then.
    return `<div class="neg"><div class="win" style="--ir:${(p.h / p.w).toFixed(4)}"><img data-src="${p.full}" data-plx="${plx}" style="background:url(${p.latent}) center/cover"></div><div class="edge">${edge}</div></div>`;
  };

  const screen = document.getElementById('screen');
  const els = SCENES.map(sc => {
    const s = document.createElement('div');
    const ps = (sc.ids || []).map(id => byId[id]);
    sc.tint = sc.tint || ps[0].tint;
    if (sc.type === 'text') {
      s.className = 'slide txtscene';
      s.innerHTML = `<div class="mover"><div class="txt">${sc.html}</div></div>`;
      if (sc.scatter && !RM) {
        s.querySelectorAll('h1, .line').forEach(node => {
          node.innerHTML = node.innerHTML.split(/(<br>)/i).map(seg =>
            /^<br>$/i.test(seg) ? seg : [...seg].map(c => c === ' ' ? ' ' : `<span class="ch">${c}</span>`).join('')
          ).join('');
        });
        sc.chs = [...s.querySelectorAll('.ch')];
      }
    } else if (sc.type === 'solo') {
      s.className = 'slide solo';
      s.innerHTML = `<div class="fill" style="background-image:url(${ps[0].full})"></div><div class="mover">${neg(ps[0], true)}</div>`;
    } else if (sc.type === 'diptych') {
      s.className = 'slide diptych';
      s.innerHTML = `<div class="fill" style="background-image:url(${ps[0].full})"></div><div class="mover"><div class="pair">` +
        ps.map(p => neg(p, false)).join('') + `</div></div>`;
    } else if (sc.type === 'strip') {
      s.className = 'slide strip';
      s.innerHTML = `<div class="mover"><div class="frames">` + ps.map(p => neg(p, false)).join('') + `</div></div>`;
    }
    screen.appendChild(s);
    sc.imgs = [...s.querySelectorAll('.win img')];
    sc.wins = [...s.querySelectorAll('.win')];
    sc.edges = [...s.querySelectorAll('.edge')];
    return s;
  });

  const spacer = document.getElementById('spacer');
  const counter = document.getElementById('counter');
  const dot = document.getElementById('dot');
  const hint = document.getElementById('hint');
  const bg = document.getElementById('bg');
  const scrim = document.getElementById('scrim');
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

  const glows = [document.getElementById('glowA'), document.getElementById('glowB')];
  let gActive = 0, gTint = '';
  function setGlow(tint) {
    if (tint === gTint) return;
    gTint = tint;
    const n = parseInt(tint.slice(1), 16), up = c => Math.min(255, Math.round(c * 3.1));
    const col = `rgba(${up(n >> 16 & 255)}, ${up(n >> 8 & 255)}, ${up(n & 255)}, .22)`;
    gActive ^= 1;
    glows[gActive].style.background = `radial-gradient(ellipse 95% 58% at 50% -12%, ${col}, transparent 62%)`;
    glows[gActive].style.opacity = 1;
    glows[gActive ^ 1].style.opacity = 0;
  }

  const dust = document.getElementById('dust');
  for (let k = 0; k < 14; k++) {
    const m = document.createElement('span');
    const size = 1.5 + Math.random() * 2;
    m.style.cssText = `left:${Math.random() * 100}%;top:${40 + Math.random() * 60}%;width:${size}px;height:${size}px;` +
      `--o:${0.12 + Math.random() * 0.22};--sway:${(Math.random() * 44 - 22).toFixed(0)}px;` +
      `animation-duration:${18 + Math.random() * 22}s;animation-delay:${-Math.random() * 30}s;`;
    dust.appendChild(m);
  }

  function layout() { spacer.style.height = (SCENES.length * SEG + 0.7) * innerHeight + 'px'; }

  function paint(t) {
    const vh = innerHeight, narrow = innerWidth < 700;
    if (t > 0.15) hint.classList.add('gone'); else hint.classList.remove('gone');
    els.forEach((s, i) => {
      const sc = SCENES[i];
      const d = t - i, ad = Math.abs(d);
      // promote lazy images a couple of scenes ahead of view so they're decoded by the time they're visible
      if (ad < 2.5) sc.imgs.forEach(im => { if (!im.src) im.src = im.dataset.src; });
      if (ad > 1.1) { s.style.visibility = 'hidden'; s.style.opacity = 0; return; }
      s.style.visibility = 'visible';
      // Recipe 4 dip-to-black: photos hand off through the scrim, hardly overlapping
      s.style.opacity = clamp(1 - ad * (sc.type === 'strip' ? 1.3 : 2.2), 0, 1);
      const env = ease(clamp(1 - Math.max(0, ad - 0.1) * 1.6, 0, 1));   // eased scene envelope (Recipe 5)
      const mover = s.querySelector('.mover');

      if (sc.type === 'text') {
        if (sc.chs) {
          const p = 1 - env;
          sc.chs.forEach((c, k) => {
            c.style.transform = p < 0.004 ? '' :
              `translate(${Math.sin(k * 12.9898) * 320 * p}px, ${Math.cos(k * 7.77) * 220 * p + p * p * 160}px) rotate(${Math.sin(k * 3.7) * 200 * p}deg)`;
            c.style.opacity = 1 - p * 0.85;
          });
        } else {
          const line = s.querySelector('.line');
          if (line) line.style.opacity = env;
        }
        mover.style.transform = `translateY(${d * -vh * 0.05}px)`;
        return;
      }

      // Recipe 4: continuous micro-zoom, 1.0 <-> 1.06, linear on lerped progress. No rotation, no filters.
      const zoom = 1 + 0.06 * clamp(ad * 1.4, 0, 1);
      if (sc.type === 'strip') {
        mover.style.transform = narrow ? `translateY(${d * -vh * 0.12}px)`
          : `translateX(${d * -mover.firstElementChild.offsetWidth * 1.05}px)`;
        // the gate: strip frames light up by their OWN position — opacity dim (preserves the grade), not brightness
        sc.imgs.forEach(img => {
          const b = img.getBoundingClientRect();
          const off = narrow ? Math.abs((b.top + b.bottom) / 2 - vh / 2) / vh
                             : Math.abs((b.left + b.right) / 2 - innerWidth / 2) / innerWidth;
          const dv = ease(clamp(1 - Math.max(0, off - 0.17) * 4.5, 0, 1));
          img.style.opacity = .25 + .75 * dv;
          if (!RM) img.style.transform = `translateY(${d * -img.dataset.plx * 0.6}px)`;
        });
      } else {
        mover.style.transform = `translateY(${d * -vh * 0.06}px) scale(${zoom})`;
        // Recipe 2: inner parallax — the photo drifts inside its overflow-hidden window
        sc.imgs.forEach(img => { if (!RM) img.style.transform = `translateY(${d * -img.dataset.plx}px)`; img.style.opacity = 1; });
      }

      // the two clip-mask set pieces (Recipe 3 / Gradogna: position, opacity, clip masks)
      if (sc.mask === 'letterbox') {
        const p = ease(clamp((0.5 - ad) / 0.35, 0, 1));
        sc.wins[0].style.clipPath = `inset(${45 * (1 - p)}% 0 ${45 * (1 - p)}% 0)`;
      } else if (sc.mask === 'iris') {
        const p = ease(clamp((0.55 - ad) / 0.4, 0, 1));
        sc.wins[0].style.clipPath = `circle(${18 + 82 * p}% at 50% 50%)`;
      }
      // Recipe 7: the edge print lands a beat after the image
      const ep = ease(clamp((0.32 - ad) / 0.22, 0, 1));
      sc.edges.forEach(e => e.style.opacity = ep);
    });

    // the scrim breathes up between scenes and clears on them (peak 0.45 at each handoff)
    const frac = t - Math.floor(t);
    scrim.style.opacity = (t > 0.3 && t < SCENES.length - 1.3)
      ? clamp(0.45 * (1 - Math.abs(frac - 0.5) / 0.16), 0, 0.45) : 0;

    const r = clamp(Math.round(t), 0, SCENES.length - 1);
    bg.style.backgroundColor = SCENES[r].tint;
    setGlow(SCENES[r].tint);
    const total = window.SCENES.length;              // photo-scene count only (excludes the intro/outro cards)
    counter.textContent = String(clamp(r, 1, total)).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
    counter.style.opacity = (t > 0.6 && t < SCENES.length - 1.4) ? 1 : 0;
    dot.style.top = clamp(t / (SCENES.length - 1), 0, 1) * 100 + '%';
  }

  // Recipe 1: scroll sets the target; the rendered value chases it through a lerp each frame
  let tTarget = 0, tSmooth = 0, last = 0;
  const readScroll = () => { tTarget = scrollY / (innerHeight * SEG); };
  addEventListener('scroll', readScroll, { passive: true });
  addEventListener('resize', () => { layout(); readScroll(); });
  window.__render = t => { if (typeof t === 'number') { tTarget = tSmooth = t; } paint(tSmooth); };   // deterministic probe (rAF pauses in hidden panes)
  (function tick(now) {
    const dt = Math.min(3, (now - last) / 16.7 || 1); last = now;
    if (RM) { tSmooth = tTarget; } else { tSmooth += (tTarget - tSmooth) * (1 - Math.pow(1 - LERP, dt)); }
    paint(tSmooth);
    requestAnimationFrame(tick);
  })(0);
  layout(); readScroll(); paint(0);
})();
</script>
</body>
</html>
